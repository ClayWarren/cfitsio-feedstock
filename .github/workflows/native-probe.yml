name: CFITSIO 4.6.4 native Windows ARM64
on:
  push:
    branches: [codex/cfitsio464-arm64-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/cfitsio-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch and verify the official source archive
        shell: pwsh
        run: |
          $cache = 'C:\bld\src_cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $archive = "$cache\cfitsio-4.6.4_227b637b91.tar.gz"
          curl.exe --fail --location --retry 3 --retry-all-errors --max-time 120 --dump-header "$env:RUNNER_TEMP\cfitsio-source-headers.txt" --output $archive https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-4.6.4.tar.gz
          $fetchExit = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\cfitsio-source-headers.txt"
          if ($fetchExit -ne 0) { throw "Official source fetch failed: $fetchExit" }
          $expected = '227b637b91c9820ea96f39a65eb087f053de567d82f4338e2884f123f8183c55'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) {
            throw 'Official source checksum mismatch'
          }
      - name: Build and test CFITSIO
        shell: cmd
        env:
          BUILD_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld
          CONFIG: ${{ matrix.config }}
          MINIFORGE_HOME: C:\Miniforge
          PYTHONUNBUFFERED: '1'
          UPLOAD_PACKAGES: 'False'
          RATTLER_BUILD_COLOR: always
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call ".scripts\run_win_build.bat"
      - name: Preserve CFITSIO package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfitsio-arm64-package
          path: C:\bld\win-arm64\cfitsio-*.conda
          if-no-files-found: warn
          retention-days: 90
